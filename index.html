<style>
:root{
  --bg:#eef2ef;--panel:#ffffff;--panel2:#e6ece8;--text:#10231a;--muted:#5b6d63;--line:#d3dcd6;
  --accent:#2453ff;--on-accent:#ffffff;--danger:#d1382f;--shadow:0 10px 30px rgba(16,35,26,.16);--glass:rgba(255,255,255,.92);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1511;--panel:#15201a;--panel2:#1d2b23;--text:#e8f0ea;--muted:#8ea398;--line:#2a3b31;
    --accent:#7ea2ff;--on-accent:#0a1230;--danger:#ff7a70;--shadow:0 10px 30px rgba(0,0,0,.5);--glass:rgba(21,32,26,.94);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1511;--panel:#15201a;--panel2:#1d2b23;--text:#e8f0ea;--muted:#8ea398;--line:#2a3b31;
  --accent:#7ea2ff;--on-accent:#0a1230;--danger:#ff7a70;--shadow:0 10px 30px rgba(0,0,0,.5);--glass:rgba(21,32,26,.94);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:800 24px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:9px;margin-right:auto}
.brand em{font-style:normal;color:var(--accent)}
.logo{width:28px;height:28px;border-radius:9px;background:#2f7d3a;position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.logo:before{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:2px;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.logo:after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border:2px solid rgba(255,255,255,.85);border-radius:50%;transform:translate(-50%,-50%)}
nav{display:flex;gap:3px;background:var(--panel2);padding:3px;border-radius:12px}
nav button{border:0;background:transparent;padding:7px 16px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text);min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.pi:focus-visible,nav button:focus-visible,.sc:focus-visible,.rb:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.icon{padding:0;width:38px}
.btn.danger{color:var(--danger)}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
svg.i{flex:none}

.view{flex:1;min-height:0;display:none}
.view.on{display:flex}
.wrap{max-width:1080px;width:100%;margin:0 auto;padding:18px 16px 40px}
#v-lib,#v-sess{overflow:auto}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vhead h2{margin:0;font:800 30px/1 'Barlow Condensed',sans-serif}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical}
input[type=range]{padding:0}
.muted{color:var(--muted)}

/* ---------- pizarra ---------- */
#v-board{display:none;grid-template-columns:128px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"pal bar" "pal stage" "pal tl"}
#v-board.on{display:grid}
#bar{grid-area:bar;display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar #exName{flex:1 1 180px;min-width:120px;font-weight:600}
#bar #fieldSel{flex:0 1 190px;min-width:110px}
#pal{grid-area:pal;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 8px 20px}
#pal h4{margin:12px 2px 5px;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.06em;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pi{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:4px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:11px;line-height:1.1}
.pi canvas,.pi svg.cur{width:46px;height:46px;border-radius:9px;background:#2f7d3a;display:block}
.pi.on{outline:2px solid var(--accent);outline-offset:0;background:var(--panel)}
#stageWrap{grid-area:stage;position:relative;background:#0b120e;min-height:170px;min-width:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,18,14,.8);color:#fff;padding:12px 18px;border-radius:14px;text-align:center;pointer-events:none;max-width:80%;font-weight:500}
#topnote{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:min(560px,58%);background:rgba(10,18,14,.82);color:#fff;padding:6px 14px;border-radius:12px;font-weight:600;font-size:13px;text-align:center;pointer-events:none;z-index:4}
#topnote.act{pointer-events:auto;background:var(--accent);color:var(--on-accent);display:flex;gap:10px;align-items:center;padding:5px 6px 5px 14px}
#topnote.act b{font-weight:800}
#topnote.act .btn{min-height:28px;padding:2px 10px;font-size:12px;background:rgba(255,255,255,.18);color:inherit;border-color:transparent}
#legend{position:absolute;right:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none;max-width:24%;z-index:3}
.lg{background:rgba(10,18,14,.72);color:#fff;border-radius:999px;padding:2px 9px;font:600 11px 'Barlow',sans-serif;display:flex;gap:5px;align-items:center}
.lg i{width:14px;height:4px;border-radius:2px;display:block}

#radial{position:absolute;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none;transition:opacity .12s}
#radial.hide{opacity:0}
.rb{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:19px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);color:var(--text);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10.5px/1 'Barlow',sans-serif;cursor:pointer;pointer-events:auto;transform:translate(0,0) scale(.2);opacity:0;transition:transform .24s cubic-bezier(.2,1.5,.4,1) var(--d),opacity .15s var(--d)}
#radial.open .rb{transform:translate(var(--x),var(--y)) scale(1);opacity:1}
#radial.hide .rb{pointer-events:none}
.rb.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.rb.danger{color:var(--danger)}
.rb.on.danger{color:var(--on-accent)}

#selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(600px,calc(100% - 16px));display:flex;flex-direction:column;gap:6px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow);z-index:7}
#selbar.top{top:44px;bottom:auto}
#selbar .btn{min-height:34px;padding:5px 10px}
#selbar .btn.icon{width:34px;padding:0}
#selbar input,#selbar select{min-height:34px;padding:5px 9px;width:auto}
.cr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nm{width:130px!important}.num{width:62px!important;text-align:center;font-weight:700}
.note{flex:1 1 170px;min-width:140px;width:auto!important}
.lab{font-weight:700;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:30px;color:var(--text)}
.chip:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.plain:before{display:none}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.info{font:700 15px 'Barlow Condensed',sans-serif;color:var(--muted);margin-right:auto;padding-left:4px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sep{width:1px;height:22px;background:var(--line)}

#tl{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px;min-width:0}
.tlc{display:flex;gap:6px;align-items:center;margin-bottom:8px;overflow-x:auto}
.tlc .btn{flex:none}
.tlc input[type=range]{flex:1 1 120px;min-width:80px;min-height:0;border:0;background:transparent;accent-color:var(--accent);height:28px}
.tlc select{width:auto;flex:none}
#scenes{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sc{flex:0 0 auto;position:relative;width:112px;aspect-ratio:1.6;border-radius:10px;border:2px solid var(--line);background:#0b120e;padding:0;cursor:pointer;overflow:hidden}
.sc canvas{width:100%;height:100%;display:block}
.sc span{position:absolute;left:5px;top:4px;background:rgba(0,0,0,.6);color:#fff;font:700 12px 'Barlow Condensed',sans-serif;border-radius:6px;padding:0 6px}
.sc.on{border-color:var(--accent)}
.sc .x{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:7px;border:0;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sc.add{background:var(--panel2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;border-style:dashed}
.sc.add small{font-size:12px}
#tp{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.tphead{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.tphead label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);flex:1 1 200px}
.tphead .dur{display:flex;gap:4px;align-items:center;flex:none}
.tphead .dur b{min-width:96px;text-align:center;font:800 17px 'Barlow Condensed',sans-serif;color:var(--text)}
.trow{display:flex;gap:8px;align-items:center;margin:5px 0}
.tl-chip{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 13px 'Barlow Condensed',sans-serif;color:#111;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ttrack{position:relative;flex:1;height:26px;background:var(--panel);border-radius:8px;overflow:hidden}
.tbar{position:absolute;top:3px;bottom:3px;border-radius:6px;cursor:ew-resize;display:flex;align-items:center;justify-content:center;touch-action:none;min-width:16px}
.tbar i{font:700 10px 'Barlow',sans-serif;font-style:normal;color:#10231a;pointer-events:none}
.audrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;padding:7px 9px;background:var(--panel);border-radius:10px}
.audrow b{font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-right:auto}
.audrow .btn{min-height:32px;padding:4px 10px}
.audrow .rec{color:var(--danger);font-weight:800;margin-right:auto;display:inline-flex;gap:8px;align-items:center}
.rdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#selbar.hide{opacity:0;pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.tile{background:var(--panel2);border-radius:12px;padding:9px 11px}
.tile b{display:block;font:800 24px/1.05 'Barlow Condensed',sans-serif}
.tile small{color:var(--muted);font-size:12px;line-height:1.2;display:block;margin-top:2px}
.tile.hl{background:var(--accent);color:var(--on-accent)}.tile.hl small{color:inherit;opacity:.85}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);min-width:60px}
.sbar i{display:block;height:100%}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pform{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pform label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.mcard.wide{max-width:940px}
.mh{margin:16px 0 8px;font:800 19px 'Barlow Condensed',sans-serif}
.phb{min-height:84px;background:#1f4d2a}
.legend2{font-size:12px;color:var(--muted)}
.ltable td small{color:var(--muted)}


/* ---------- biblioteca ---------- */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.folder{margin:22px 0 10px;font:800 20px 'Barlow Condensed',sans-serif;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.cthumb{aspect-ratio:1.6;background:#0b120e}
.cthumb img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody b{font:800 19px/1.1 'Barlow Condensed',sans-serif}
.cbody small{color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--panel2);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.crow{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.crow .pri{flex:1}
.empty{border:2px dashed var(--line);border-radius:18px;padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font:800 22px 'Barlow Condensed',sans-serif;margin-bottom:4px}

/* ---------- sesión ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.sform{margin-bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.item{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.ithumb{aspect-ratio:1.6;background:#0b120e;border-radius:10px;overflow:hidden;align-self:start}
.ithumb img{width:100%;height:100%;object-fit:cover;display:block}
.ihead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.ihead b{font:800 19px 'Barlow Condensed',sans-serif}
.ifields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:6px}
.ifields label{display:flex;flex-direction:column;font-size:11px;font-weight:600;color:var(--muted);gap:2px}
.ifields input{min-height:34px;padding:5px 7px}
.item textarea{min-height:34px}
.totals{margin-top:12px;font:700 18px 'Barlow Condensed',sans-serif}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(6,12,9,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.mcard{background:var(--panel);border-radius:18px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:var(--shadow)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h3{margin:0;font:800 24px 'Barlow Condensed',sans-serif}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mcard img.prev,.mcard video.prev{width:100%;border-radius:12px;display:block;background:#0b120e}
.mcard hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.pick{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.pick img{width:92px;aspect-ratio:1.6;object-fit:cover;border-radius:8px;background:#0b120e}
.pick b{flex:1;font:800 18px 'Barlow Condensed',sans-serif}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--panel);text-align:left;padding:0;display:flex;flex-direction:column}
.tpl:hover{border-color:var(--accent)}
.tpl img,.tpl .blank{width:100%;aspect-ratio:1.6;object-fit:cover;background:#0b120e;display:flex;align-items:center;justify-content:center;color:#fff}
.tpl div{padding:8px 10px}
.tpl b{display:block;font:800 17px/1.1 'Barlow Condensed',sans-serif}
.tpl small{color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.prog{height:12px;border-radius:8px;background:var(--panel2);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.ltable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.ltable td,.ltable th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.ltable th{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}

#printSheet{display:none}

/* ---------- móvil ---------- */
@media (max-width:820px){
  header{padding:8px 10px;gap:8px}
  nav{order:3;width:100%}
  nav button{flex:1;padding:8px 6px}
  #v-board{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"bar" "stage" "pal" "tl"}
  #bar{flex-wrap:nowrap;overflow-x:auto;padding:6px 8px}
  #bar>*{flex:none}
  #bar #exName{flex:1 0 150px}
  #bar #fieldSel{flex:0 0 150px}
  #bar .lbl-t{display:none}
  #bar .btn.pri .lbl-t{display:inline}
  #pal{display:flex;flex-direction:row;gap:12px;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:6px 8px}
  #pal h4{display:none}
  .pg{display:flex;gap:5px;flex:none}
  .pgrid{display:flex;gap:5px}
  .pg+.pg{border-left:1px solid var(--line);padding-left:10px}
  .pi{min-width:58px;flex:none}
  .pi canvas,.pi svg.cur{width:40px;height:40px}
  .sc{width:92px}
  .form{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .ithumb{max-width:220px}
  .ifields{grid-template-columns:repeat(3,minmax(0,1fr))}
  #legend{display:none}
  #topnote{max-width:86%;font-size:12px;top:6px}
  #selbar{bottom:6px;padding:6px 8px}
  #selbar.top{top:38px}
  .rb{width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:17px}
}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  #app,#modal,#toast{display:none!important}
  #printSheet{display:block;font-family:'Barlow',Arial,sans-serif;color:#000}
  #printSheet h1{font:800 30px 'Barlow Condensed',Arial,sans-serif;margin:0 0 4px}
  #printSheet .meta{color:#444;margin:0 0 14px;font-size:13px}
  #printSheet .pit{display:grid;grid-template-columns:200px 1fr;gap:12px;border-top:1px solid #999;padding:10px 0;break-inside:avoid}
  #printSheet img{width:200px;border-radius:6px;border:1px solid #bbb}
  #printSheet h3{margin:0 0 4px;font:800 19px 'Barlow Condensed',Arial,sans-serif}
  #printSheet .chips{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:4px}
  #printSheet p{margin:2px 0;font-size:13px;white-space:pre-wrap}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.rb{transition:none!important}}

<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo"></span>PIZARRA<em>FIT</em></div>
    <nav id="nav">
      <button data-v="board" class="on">Pizarra</button>
      <button data-v="lib">Biblioteca</button>
      <button data-v="sess">Sesión</button>
    </nav>
    <button class="btn" id="bInstall" hidden><span data-ic="download"></span>Instalar</button>
    <button class="btn icon" id="bTheme" title="Cambiar tema" aria-label="Cambiar tema"></button>

  <!-- PIZARRA -->

      <input id="exName" placeholder="Nombre del ejercicio" aria-label="Nombre del ejercicio">
      <select id="fieldSel" aria-label="Campo"></select>
      <button class="btn icon" id="bUndo" title="Deshacer" aria-label="Deshacer"></button>
      <button class="btn icon" id="bRedo" title="Rehacer" aria-label="Rehacer"></button>

      <button class="btn" id="bVid"><span data-ic="film"></span><span class="lbl-t">Video</span></button>
      <button class="btn" id="bStats"><span data-ic="chart"></span><span class="lbl-t">Estadísticas</span></button>
      <button class="btn" id="bNew"><span data-ic="plus"></span><span class="lbl-t">Nuevo</span></button>
      <button class="btn pri" id="bSave"><span data-ic="save"></span><span class="lbl-t">Guardar</span></button>
    </div>
    <aside id="pal" aria-label="Elementos"></aside>
    <div id="stageWrap">
      <canvas id="stage" aria-label="Pizarra de entrenamiento"></canvas>
      <div id="legend"></div>
      <div id="topnote" hidden></div>
      <div id="hint">Elegí un elemento a la izquierda y tocá la cancha para ponerlo. Arrastralo para acomodarlo.<br>Tocá un jugador y elegí Correr, Conducir o Pasar: después arrastrá los que quieras sin volver a elegir.</div>
      <div id="radial" hidden></div>
      <div id="selbar" hidden></div>
    </div>
    <div id="tl">
      <div class="tlc">
        <button class="btn pri icon" id="bPlay" title="Reproducir animación" aria-label="Reproducir"></button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Línea de tiempo">
        <button class="btn icon" id="loopB" title="Repetir" aria-label="Repetir"></button>
        <select id="spd" aria-label="Velocidad"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option><option value="6">6×</option><option value="8">8×</option><option value="12">12×</option><option value="16">16×</option></select>
        <button class="btn" id="bTime" title="Tiempos y duración de la escena"><span data-ic="clock"></span>Tiempos</button>
        <button class="btn on" id="bDist" title="Mostrar metros" aria-label="Mostrar metros"><span data-ic="ruler"></span></button>
        <button class="btn" id="bRot" hidden><span data-ic="repeat"></span>Rotar estaciones</button>
      </div>
      <div id="tp" hidden>
        <div class="tphead">
          <label>Descripción de la escena<input id="scCap" maxlength="110" placeholder="Ej: El 9 se desmarca y el 10 lo habilita"></label>
          <div class="dur"><button class="btn icon" id="durM" aria-label="Menos tiempo">−</button><b id="durV">Auto</b><button class="btn icon" id="durP" aria-label="Más tiempo">+</button><button class="btn" id="durA">Auto</button></div>
        </div>
        <div id="audRow" class="audrow"></div>
        <div id="tbars"></div>
      </div>
      <div id="scenes"></div>
    </div>
  </section>

  <!-- BIBLIOTECA -->
  <section id="v-lib" class="view"><div class="wrap">
    <div class="vhead">
      <h2>Biblioteca de ejercicios</h2>
      <div class="row"><input id="q" placeholder="Buscar por nombre, etiqueta o tipo" style="width:260px" aria-label="Buscar"><button class="btn" id="bEx">Ejemplos</button><button class="btn" id="bBackup">Copia de seguridad</button></div>
    </div>
    <div id="libList"></div>
  </div></section>

  <!-- SESIÓN -->
  <section id="v-sess" class="view"><div class="wrap">
    <div class="vhead">
      <h2>Sesión de entrenamiento</h2>
      <div class="row">
        <select id="sSel" style="width:220px" aria-label="Sesión"></select>
        <button class="btn" id="sEx">Sesión de ejemplo</button>
        <button class="btn" id="sNew"><span data-ic="plus"></span>Nueva</button>
        <button class="btn danger" id="sDel"><span data-ic="trash"></span></button>
        <button class="btn pri" id="sPrint"><span data-ic="print"></span>Imprimir / PDF</button>
      </div>
    </div>
    <div id="sBody"></div>
  </div></section>
</div>

<div id="modal" hidden><div class="mcard"><div class="mhead"><h3 id="mTitle"></h3><button class="btn icon" id="mX" aria-label="Cerrar"></button></div><div id="mBody"></div></div></div>
<input type="file" id="audFile" accept="audio/*,.m4a,.mp3,.wav,.ogg,.opus,.aac" hidden>
<div id="toast" hidden></div>

function pitch(ctx,W,H,o){

  ctx.strokeRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,o.circ,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,.35,0,7);ctx.fill();
  const gd=o.gd||1.8;
  for(let side=0;side<2;side++){
    ctx.save();
    if(side){ctx.translate(W,0);ctx.scale(-1,1)}
    ctx.strokeRect(0,(H-o.penH)/2,o.penW,o.penH);
    if(o.gaW)ctx.strokeRect(0,(H-o.gaH)/2,o.gaW,o.gaH);
    ctx.beginPath();ctx.arc(o.spot,H/2,.3,0,7);ctx.fill();
    if(o.arc){const a=Math.acos((o.penW-o.spot)/o.arc);ctx.beginPath();ctx.arc(o.spot,H/2,o.arc,-a,a);ctx.stroke()}
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(-gd,(H-o.goal)/2,gd,o.goal);
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.strokeRect(-gd,(H-o.goal)/2,gd,o.goal);
    ctx.restore();
  }
  const r=o.corner||1;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W,0,r,Math.PI/2,Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(W,H,r,Math.PI,Math.PI*1.5);ctx.stroke();
  ctx.beginPath();ctx.arc(0,H,r,Math.PI*1.5,Math.PI*2);ctx.stroke();
}
function drawField(ctx,key,pad){
  const F=FIELDS[key],W=F.w,H=F.h;

  ctx.fillStyle=F.bg;ctx.fillRect(-pad,-pad,W+2*pad,H+2*pad);

  if(key==='full'){pitch(ctx,105,68,{circ:9.15,penW:16.5,penH:40.32,gaW:5.5,gaH:18.32,spot:11,arc:9.15,goal:7.32})}

    ctx.beginPath();ctx.rect(-.2,-pad,W+pad+.2,H+2*pad);ctx.clip();
    ctx.translate(-52.5,0);pitch(ctx,105,68,{circ:9.15,penW:16.5,penH:40.32,gaW:5.5,gaH:18.32,spot:11,arc:9.15,goal:7.32});
  }

    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=.12;ctx.beginPath();

    ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=.25;ctx.strokeRect(0,0,W,H);
  }else{ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=.2;ctx.strokeRect(0,0,W,H)}

}

/* ============ selección y tarjeta de propiedades ============ */
function selObj(){if(!S.sel)return null;const sc=scene();return S.sel.k==='el'?sc.els.find(e=>e.id===S.sel.id):sc.arrows.find(a=>a.id===S.sel.id)}
function setProp(id,patch){S.ex.scenes.forEach((sc,i)=>{if(i>=S.cur){const e=sc.els.find(x=>x.id===id);if(e)Object.assign(e,patch)}})}
function renderCard(){
  const b=$('#selbar'),o=selObj();
  renderRadial();
  if(!o){S.menu=false;S.card=false;b.hidden=true;b.innerHTML='';paint();return}
  if(!S.card){b.hidden=true;b.innerHTML='';paint();return}
  b.hidden=false;const sc=scene();let h='';
  const sw=(c,cols)=>`<button class="sw${o.c===c?' on':''}" data-a="color" data-v="${c}" style="background:${c}" aria-label="Color ${c}"></button>`;
  if(S.sel.k==='ar'&&o.k==='measure'){
    const md=Math.hypot(o.x2-o.x1,o.y2-o.y1);
    h+=`<div class="cr"><span class="lab">Distancia</span><input id="mD" class="num" style="width:96px!important" type="number" min="0.1" step="0.1" value="${md.toFixed(2)}" aria-label="Distancia en metros"><span class="lab">m</span><button class="chip plain${o.show!==false?' on':''}" data-a="mshow">${o.show!==false?'Visible en la pizarra':'Oculta'}</button><span class="info">${o.a||o.b?'Seguí los conos: se mueve con ellos':'Medida libre'}</span><button class="btn icon danger" data-a="del" title="Eliminar">${ic('trash')}</button><button class="btn pri" data-a="done">${ic('check')}Listo</button></div>`;
  }else if(S.sel.k==='ar'){
    h+=`<div class="cr"><select id="sbK" aria-label="Tipo"><option value="run">Flecha</option><option value="pass">Punteada</option><option value="dribble">Ondulada</option><option value="line">Línea</option></select>${COLORS.map(c=>sw(c)).join('')}<span class="sep"></span><button class="btn icon" data-a="straight" title="Enderezar">${ic('straight')}</button><button class="btn icon danger" data-a="del" title="Eliminar">${ic('trash')}</button></div>`;
  }else if(o.t==='player'){
    const r=sc.routes[o.id],inf=r&&r.segs.length?routeInfo(o,r):null,seg=S.sel.seg,gs=(seg!=null&&r&&r.segs[seg]&&r.segs[seg].k!=='pass')?r.segs[seg]:null,pace=gs?gs.p:(o.pc||'jog');
    h+=`<div class="cr"><input id="cN" class="nm" maxlength="14" placeholder="Nombre" value="${esc(o.nm||'')}" aria-label="Nombre"><input id="cL" class="num" maxlength="3" placeholder="N°" value="${esc(o.l||'')}" aria-label="Número">${TEAM.map(c=>sw(c)).join('')}</div>`;
    h+=`<div class="cr"><span class="lab">Ritmo${gs?' del tramo '+(seg+1):''}</span>${Object.keys(PACES).map(k=>`<button class="chip${pace===k?' on':''}" data-a="pace" data-v="${k}" style="--c:${PACES[k].c}">${PACES[k].n}</button>`).join('')}<span class="sep"></span><button class="chip plain${o.st==='rest'?' on':''}" data-a="rest">${o.st==='rest'?'Descansa':'Trabaja'}</button></div>`;
    if(r&&r.segs.some(g=>g.q))h+=`<div class="cr"><span class="info">Se traslada sin flecha (lo ves solo al reproducir)</span><button class="chip plain" data-a="showq">Mostrar la flecha</button></div>`;
    h+=`<div class="cr"><input id="cC" class="note" maxlength="90" placeholder="Consigna (ej: 3 desmarques y vuelve)" value="${esc(o.note||'')}" aria-label="Consigna">${inf?`<label class="lab" style="display:inline-flex;gap:4px;align-items:center">Tiempo<input id="cT" class="num" style="width:74px!important" type="number" min="0.5" step="0.1" value="${inf.T.toFixed(1)}" aria-label="Tiempo total en segundos">s</label><span class="info">${fmtM(inf.L)}${inf.T>0?' · '+(inf.L/inf.T*3.6).toFixed(1)+' km/h':''}</span>`:''}${seg!=null&&r&&r.segs[seg]?`<button class="btn" data-a="delseg">Quitar tramo</button>`:''}<button class="btn pri" data-a="done">${ic('check')}Listo</button></div>`;
  }else if(o.t==='ball'){
    const r=sc.routes[o.id],inf=r&&r.segs.length?routeInfo(o,r):null;
    h+=`<div class="cr"><span class="info">${inf?'Pase de '+fmtM(inf.L):'Balón: elegí Pasar para moverlo'}</span><button class="btn" data-a="dup" title="Duplicar">${ic('copy')}</button><button class="btn pri" data-a="done">${ic('check')}Listo</button></div>`;
  }else{
    h+=`<div class="cr">`;
    if(o.t==='text'||o.t==='zone')h+=`<input class="nm" id="sbL" style="width:150px!important" maxlength="${o.t==='text'?28:24}" value="${esc(o.l||'')}" placeholder="${o.t==='text'?'Texto':'Nombre de la zona'}" aria-label="Etiqueta">`;
    if(hasColor(o.t))h+=COLORS.map(c=>sw(c)).join('')+'<span class="sep"></span>';
    h+=`<button class="btn icon" data-a="rotl" title="Girar a la izquierda">${ic('rotl')}</button><button class="btn icon" data-a="rotr" title="Girar a la derecha">${ic('rotr')}</button><button class="btn icon" data-a="smaller" title="Más chico">${ic('minus')}</button><button class="btn icon" data-a="bigger" title="Más grande">${ic('plus')}</button><button class="btn icon" data-a="dup" title="Duplicar">${ic('copy')}</button><button class="btn icon danger" data-a="del" title="Eliminar">${ic('trash')}</button></div>`;
  }
  b.innerHTML=h;if(S.sel.k==='ar'&&o.k!=='measure'){const s=$('#sbK');if(s)s.value=o.k}
  paint();
}
$('#selbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const o=selObj();if(!o)return;const a=b.dataset.a,sc=scene(),isEl=S.sel.k==='el';
  if(a==='done'){S.sel=null;renderCard();return}
  if(a==='showq'){const r=sc.routes[o.id];if(r)r.segs.forEach(g=>{delete g.q});commit();renderCard();return}
  if(a==='mshow'){applyMeasure(o.id,{show:o.show===false});commit();renderCard();return}
  if(a==='del'){if(isEl)delEl(o.id);else if(o.k==='measure')S.ex.scenes.forEach(s=>{s.arrows=s.arrows.filter(x=>x.id!==o.id)});else sc.arrows=sc.arrows.filter(x=>x.id!==o.id);S.sel=null;renderCard();commit();return}
  if(a==='dup'){dupSel();return}
  if(a==='color'){if(isEl)setProp(o.id,{c:b.dataset.v});else o.c=b.dataset.v;commit();renderCard();return}
  if(a==='pace'){
    const r=sc.routes[o.id],k=b.dataset.v;
    if(S.sel.seg!=null&&r&&r.segs[S.sel.seg]&&r.segs[S.sel.seg].k!=='pass'){r.segs[S.sel.seg].p=k;delete r.segs[S.sel.seg].v}
    else{setProp(o.id,{pc:k});if(r)r.segs.forEach(g=>{if(g.k!=='pass'){g.p=k;delete g.v}})}
    commit();renderCard();return;
  }
  if(a==='rest'){setProp(o.id,{st:o.st==='rest'?'work':'rest'});commit();renderCard();return}
  if(a==='delseg'){const r=sc.routes[o.id];if(r&&r.segs.length){r.segs.splice(S.sel.seg,1);if(!r.segs.length)delete sc.routes[o.id]}S.sel.seg=null;commit();renderCard();return}
  if(a==='rotl')setProp(o.id,{r:((o.r||0)-45+360)%360});
  else if(a==='rotr')setProp(o.id,{r:((o.r||0)+45)%360});
  else if(a==='smaller')setProp(o.id,{s:Math.max(.4,(o.s||1)/1.2)});
  else if(a==='bigger')setProp(o.id,{s:Math.min(4,(o.s||1)*1.2)});
  else if(a==='straight'){o.cv=false;o.cx=(o.x1+o.x2)/2;o.cy=(o.y1+o.y2)/2}
  commit();
});
$('#selbar').addEventListener('input',e=>{
  const o=selObj(),id=e.target.id;if(!o)return;
  if(id==='cN')setProp(o.id,{nm:e.target.value});
  else if(id==='cL')setProp(o.id,{l:e.target.value});
  else if(id==='cC')setProp(o.id,{note:e.target.value});
  else if(id==='sbL')setProp(o.id,{l:e.target.value});
  paint();
});
$('#selbar').addEventListener('change',e=>{
  const o=selObj();if(!o)return;
  const id=e.target.id;
  if(id==='sbK'){o.k=e.target.value}
  else if(id==='cT'){
    const r=scene().routes[o.id],t=+e.target.value;
    if(r&&r.segs.length&&t>0){const inf=routeInfo(o,r),v=Math.max(.3,inf.L/t);r.segs.forEach(g=>{if(g.k!=='pass'){g.v=v;g.p=paceOf(v)}})}
    commit();renderCard();return;
  }
  else if(id==='mD'){const d=+e.target.value;if(d>0)setMeasureDist(o,d);commit();renderCard();return}
  commit();
});

/* ============ edición de elementos ============ */
function addEl(e){S.ex.scenes.forEach((sc,i)=>{if(i>=S.cur)sc.els.push(i===S.cur?e:clone(e))})}
function delEl(id){
  S.ex.scenes.forEach((sc,i)=>{if(i>=S.cur){sc.els=sc.els.filter(e=>e.id!==id);delete sc.routes[id];Object.keys(sc.routes).forEach(k=>{const r=sc.routes[k];if(r.carry&&r.carry.id===id)delete r.carry})}});
}
function dupSel(){
  const o=selObj();if(!o||S.sel.k!=='el')return;
  const c=clone(o);c.id=uid();c.x+=2.5;c.y+=2.5;addEl(c);S.sel={k:'el',id:c.id,seg:null};S.act='move';S.card=true;commit();renderCard();
}
function canRelocate(e){return S.cur===0||!S.ex.scenes[S.cur-1].els.some(x=>x.id===e.id)}
function place(id,p){
  const it=ITEMS[id],sc=scene(),e={id:uid(),t:it.t,x:p.x,y:p.y,r:0,s:1,c:it.c,l:''};
  if(it.t==='player'){e.l=it.l||String(sc.els.filter(x=>x.t==='player'&&x.c===it.c).length+1);e.pc='jog';e.st='work';e.nm='';e.note=''}
  if(it.t==='zone'){e.w=it.w;e.h=it.h;if(it.stn){const n=sc.els.filter(x=>x.stn).length+1;e.stn=n;e.l='Estación '+n;e.c=STN[(n-1)%STN.length]}}
  if(it.t==='text')e.l='Texto';
  addEl(e);S.sel={k:'el',id:e.id,seg:null};S.act='move';S.menu=false;S.card=it.t==='text';renderCard();commit();
}
function snapTarget(p,exId){
  const sc=scene();
  for(const e of sc.els){if(e.t!=='player'||e.id===exId)continue;
    const r=sc.routes[e.id];
    if(r&&r.segs.length){const g=r.segs[r.segs.length-1];if(dist(p,g)<2)return{x:g.x,y:g.y}}
    if(hitEl(e,p,.6))return{x:e.x,y:e.y};
  }
  return{x:p.x,y:p.y};
}
function nearestBall(pt,maxD,exId){let best=null,bd=maxD;scene().els.forEach(e=>{if(e.t==='ball'&&e.id!==exId){const d=dist(e,pt);if(d<bd){bd=d;best=e}}});return best}
function addSeg(o,kind,p){
  const sc=scene(),F=FIELDS[S.ex.field];
  let t=kind==='pass'?snapTarget(p,o.id):{x:p.x,y:p.y};
  t={x:clamp(t.x,-PAD+.6,F.w+PAD-.6),y:clamp(t.y,-PAD+.6,F.h+PAD-.6)};
  if(kind==='pass'){
    let ball=o.t==='ball'?o:nearestBall(o,4);
    if(!ball){ball={id:uid(),t:'ball',x:o.x+1.4,y:o.y+.9,r:0,s:1,c:'#ffffff',l:''};addEl(ball);toast('Puse un balón junto al jugador para poder pasar')}
    const r=sc.routes[ball.id]||(sc.routes[ball.id]={segs:[],d:0}),from=r.segs.length?r.segs[r.segs.length-1]:{x:ball.x,y:ball.y};
    if(dist(from,t)<1){if(!r.segs.length)delete sc.routes[ball.id];return}
    r.segs.push({x:t.x,y:t.y,k:'pass'});
  }else if(kind==='run'||kind==='drib'){
    const r=sc.routes[o.id]||(sc.routes[o.id]={segs:[],d:0}),from=r.segs.length?r.segs[r.segs.length-1]:{x:o.x,y:o.y};
    if(dist(from,t)<1){if(!r.segs.length)delete sc.routes[o.id];return}
    if(kind==='drib'&&!r.carry){const b=nearestBall(o,3);if(b&&!(sc.routes[b.id]&&sc.routes[b.id].segs.length))r.carry={id:b.id,dx:b.x-o.x,dy:b.y-o.y};else if(!b)toast('No hay balón cerca: se dibuja igual la conducción')}
    r.segs.push({x:t.x,y:t.y,k:kind,p:o.pc||'jog'});
  }else return;
  S.sel={k:'el',id:o.id,seg:null};S.card=false;commit();renderCard();
}

/* ============ interacción con la pizarra ============ */
function wp(e){const r=stage.getBoundingClientRect(),v=S.vt||{k:1,ox:0,oy:0};return{x:((e.clientX-r.left)*S.dpr-v.ox)/v.k,y:((e.clientY-r.top)*S.dpr-v.oy)/v.k}}
function selRoute(){if(!S.sel||S.sel.k!=='el')return null;const r=scene().routes[S.sel.id];return r&&r.segs.length?r:null}
function wpHit(p){const r=selRoute();if(!r)return-1;for(let i=r.segs.length-1;i>=0;i--){if(dist(p,r.segs[i])<2.1)return i}return-1}
function hitTest(p){
  const sc=scene(),els=sc.els.slice().sort((a,b)=>Z[a.t]-Z[b.t]).reverse();
  for(const e of els){if(e.t!=='zone'&&hitEl(e,p,.4))return{k:'el',id:e.id,seg:null}}
  for(const e of sc.els){const r=sc.routes[e.id];if(r&&r.segs.length){const g=r.segs[r.segs.length-1];if(dist(p,g)<2)return{k:'el',id:e.id,seg:r.segs.length-1}}}
  for(const e of sc.els){const r=sc.routes[e.id];if(!r||!r.segs.length)continue;const inf=routeInfo(e,r);for(let i=0;i<r.segs.length;i++){if(ptSeg(p,inf.pts[i],inf.pts[i+1])<1.3)return{k:'el',id:e.id,seg:i}}}
  for(const a of sc.arrows.slice().reverse()){if(hitAr(a,p))return{k:'ar',id:a.id,seg:null}}
  for(const e of els){if(e.t==='zone'&&hitEl(e,p))return{k:'el',id:e.id,seg:null}}
  return null;
}
const TH=6;
function segStart(o){const r=scene().routes[o.id];return r&&r.segs.length?r.segs[r.segs.length-1]:{x:o.x,y:o.y}}
function snapPt(p,exId){
  let best=null,bd=2.6;
  scene().els.forEach(e=>{if(e.id===exId||e.t==='zone'||e.t==='text'||isMover(e))return;const d=dist(e,p);if(d<bd){bd=d;best=e}});
  return best?{x:best.x,y:best.y,id:best.id}:{x:p.x,y:p.y,id:null};
}
stage.addEventListener('pointerdown',ev=>{
  if(S.pv)stopPreview();
  const p=wp(ev),sc=scene(),t=S.tool;
  try{stage.setPointerCapture(ev.pointerId)}catch(e){}
  S.px={x:ev.clientX,y:ev.clientY};
  const wi=wpHit(p);
  if(wi>=0){S.sel.seg=wi;S.menu=false;S.card=true;S.drag={type:'wp',id:S.sel.id,i:wi,moved:false};renderCard();return}
  if(ITEMS[t]&&ITEMS[t].ar){
    const it=ITEMS[t];
    if(it.ar==='measure'){const sn=snapPt(p);S.tmp={id:uid(),k:'measure',c:'#38e0ff',x1:sn.x,y1:sn.y,x2:p.x,y2:p.y,cx:(sn.x+p.x)/2,cy:(sn.y+p.y)/2,a:sn.id,b:null,show:true}}
    else S.tmp={id:uid(),k:it.ar,c:it.c,x1:p.x,y1:p.y,x2:p.x,y2:p.y,cx:p.x,cy:p.y,cv:false};
    S.drag={type:'new',moved:true};S.sel=null;S.menu=false;S.card=false;renderCard();return;
  }
  let hit=hitTest(p);
  const so=selObj(),routeMode=!!(so&&S.sel.k==='el'&&isMover(so)&&S.act!=='move');
  if(hit&&routeMode){
    /* con una acción elegida, tocar zonas, conos o flechas cuenta como marcar destino */
    const he=hit.k==='el'?sc.els.find(x=>x.id===hit.id):null;
    if(!(he&&(he.id===so.id||(isMover(he)&&S.act!=='pass'))))hit=null;
  }
  if(hit){
    const same=!!(S.sel&&S.sel.k===hit.k&&S.sel.id===hit.id);
    S.sel={k:hit.k,id:hit.id,seg:hit.seg};
    if(hit.k==='el'){
      const o=sc.els.find(x=>x.id===hit.id);
      if(isMover(o)&&S.tool!=='select')setTool('select');
      if(hit.seg!=null){S.drag=null;S.menu=false;S.card=true}
      else if(isMover(o)){if(!same)S.menu=false;S.drag={type:'mv',id:o.id,moved:false,same,dx:p.x-o.x,dy:p.y-o.y}}
      else{S.menu=false;S.drag={type:'el',id:o.id,moved:false,dx:p.x-o.x,dy:p.y-o.y}}
    }else{S.menu=false;S.drag={type:'ar',id:hit.id,lx:p.x,ly:p.y,moved:false}}
    renderCard();return;
  }
  if(routeMode){S.drag={type:'tap',moved:false};return}
  if(t!=='select'&&!ITEMS[t].ar){place(t,p);return}
  S.sel=null;S.menu=false;S.card=false;S.act='move';renderCard();
});
stage.addEventListener('pointermove',ev=>{
  const d=S.drag;if(!d)return;const p=wp(ev),sc=scene();
  if(!d.moved){if(Math.hypot(ev.clientX-S.px.x,ev.clientY-S.px.y)<=TH)return;d.moved=true;S.card=false;if(d.type==='mv'||d.type==='el')S.menu=false}
  if(d.type==='new'&&S.tmp){
    if(S.tmp.k==='measure'){const sn=snapPt(p,S.tmp.a);S.tmp.x2=sn.x;S.tmp.y2=sn.y;S.tmp.b=sn.id}else{S.tmp.x2=p.x;S.tmp.y2=p.y}
    S.tmp.cx=S.tmp.k==='measure'?(S.tmp.x1+S.tmp.x2)/2:(S.tmp.x1+S.tmp.x2)/2;S.tmp.cy=(S.tmp.y1+S.tmp.y2)/2;
  }
  else if(d.type==='el'){S.ex.scenes.forEach(s=>{const o=s.els.find(x=>x.id===d.id);if(o){o.x=p.x-d.dx;o.y=p.y-d.dy}});syncMeasures(S.ex)}
  else if(d.type==='mv'){
    const o=sc.els.find(x=>x.id===d.id);if(!o)return;
    if(S.act==='move'){
      if(canRelocate(o)){o.x=p.x-d.dx;o.y=p.y-d.dy}
      else{
        const t={x:p.x-d.dx,y:p.y-d.dy},r=sc.routes[o.id];
        if(r&&r.segs.length){const g=r.segs[r.segs.length-1];g.x=t.x;g.y=t.y}
        else if(dist({x:o.x,y:o.y},t)>.4)sc.routes[o.id]={segs:[{x:t.x,y:t.y,k:'run',p:o.pc||'jog',q:1}],d:0};
        propagateEx(S.ex,S.cur);
        if(!d.warned){d.warned=true;toast('Se traslada dentro de esta escena: vas a verlo moverse en la animación y en el video')}
      }
    }else{
      const from=(S.act==='pass'&&o.t==='player')?(nearestBall(o,4)||o):segStart(o);
      const tgt=S.act==='pass'?snapTarget(p,o.id):p;
      S.tseg={x1:from.x,y1:from.y,x2:tgt.x,y2:tgt.y,k:S.act==='pass'?'pass':S.act,p:o.pc||'jog',e:S.act==='pass'?nearestBall(o,4):o};
    }
  }
  else if(d.type==='ar'){const a=sc.arrows.find(x=>x.id===d.id);if(a&&a.k!=='measure'){const dx=p.x-d.lx,dy=p.y-d.ly;a.x1+=dx;a.x2+=dx;a.cx+=dx;a.y1+=dy;a.y2+=dy;a.cy+=dy;d.lx=p.x;d.ly=p.y}}
  else if(d.type==='wp'){const r=sc.routes[d.id];if(r&&r.segs[d.i]){r.segs[d.i].x=p.x;r.segs[d.i].y=p.y}}
  else if(d.type==='ah'){const a=sc.arrows.find(x=>x.id===d.id);if(a){
    if(d.h==='p1'){a.x1=p.x;a.y1=p.y}else if(d.h==='p2'){a.x2=p.x;a.y2=p.y}else{a.cx=2*p.x-.5*(a.x1+a.x2);a.cy=2*p.y-.5*(a.y1+a.y2);a.cv=true}
    if(!a.cv){a.cx=(a.x1+a.x2)/2;a.cy=(a.y1+a.y2)/2}}}
  paint();
});
function endDrag(ev){
  const d=S.drag;if(!d)return;S.drag=null;const p=ev&&ev.clientX!=null?wp(ev):null;
  if(d.type==='new'&&S.tmp){
    const a=S.tmp;S.tmp=null;
    if(Math.hypot(a.x2-a.x1,a.y2-a.y1)>(a.k==='measure'?.5:1.5)){
      if(a.k==='measure')addMeasure(a);else scene().arrows.push(a);
      S.sel={k:'ar',id:a.id,seg:null};S.card=true;renderCard();commit();
    }else paint();
    return;
  }
  const o=selObj();
  if(d.type==='mv'){
    S.tseg=null;
    if(!d.moved){S.card=!(d.same&&S.card);S.menu=S.act==='move'?S.card:false;renderCard();return}

  }

let last=0;

const hasMoves=()=>S.ex.scenes.some(s=>Object.keys(s.routes).some(k=>s.routes[k].segs.length));
function safePlay(a){try{const r=a.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function stopAud(){[S.aEl,S.gEl,S.pAud].forEach(a=>{if(a){try{a.pause()}catch(e){}}});S.aKey='';S.gOn=false}
function audSync(force){
  const pv=S.pv;
  if(!S.playing||!pv)return;
  const ex=S.ex,i=sceneAt(ex,pv.t),sc=ex.scenes[i],local=pv.t-startsOf(ex)[i];
  const info=sc.aud&&AUD.mem.get(sc.aud.id),key=info?sc.aud.id+'@'+i:'';
  if(S.aKey!==key||force){
    S.aKey=key;const A=S.aEl||(S.aEl=new Audio());A.pause();
    if(info){A.src=info.url;A.playbackRate=audRate();try{A.currentTime=Math.max(0,local)}catch(e){}safePlay(A)}
  }
  const gi=ex.aud&&AUD.mem.get(ex.aud.id);
  if(gi&&(!S.gOn||force)){
    const G=S.gEl||(S.gEl=new Audio());G.pause();G.src=gi.url;G.playbackRate=audRate();try{G.currentTime=Math.max(0,pv.t)}catch(e){}safePlay(G);S.gOn=true;
  }
}
function play(){
  if(S.playing){pause();return}
  if(!hasMoves()&&S.ex.scenes.length<2){toast('Primero armá un movimiento: tocá un jugador, elegí Correr y arrastralo hacia donde va');return}
  S.sel=null;S.menu=false;renderCard();S.playing=true;
  let t=S.pv?S.pv.t:startsOf(S.ex)[S.cur];if(t>=totalTime()-.05)t=0;
  S.pv={t};setPlayIcon();last=performance.now();audSync(true);requestAnimationFrame(tick);
}
function tick(ts){
  if(!S.playing)return;
  S.pv.t+=(ts-last)/1000*S.speed;last=ts;
  const tot=totalTime();let wrap=false;
  if(S.pv.t>=tot){if(S.loop){S.pv.t=0;wrap=true}else{S.pv.t=tot;S.playing=false;setPlayIcon();stopAud()}}
  $('#scrub').value=Math.round(S.pv.t/tot*1000);
  if(S.playing)audSync(wrap);
  paint();
  if(S.playing)requestAnimationFrame(tick);
}
function pause(){S.playing=false;setPlayIcon();stopAud()}
function stopPreview(){
  if(!S.pv)return;const i=sceneAt(S.ex,S.pv.t);

/* ---- estaciones ---- */
function rotateRoutes(sc,pace){
  const st=stationsOf(sc);if(st.length<2)return 0;let n=0;
  sc.els.filter(e=>e.t==='player').forEach(pl=>{
    const k=st.findIndex(z=>hitEl(z,{x:pl.x,y:pl.y}));if(k<0)return;
    const f=st[k],t=st[(k+1)%st.length];
    sc.routes[pl.id]={segs:[{x:t.x+(pl.x-f.x),y:t.y+(pl.y-f.y),k:'run',p:pace||'jog'}],d:0};n++;
  });
  return n;
}
function rotateOnce(ex,i,capPrefix){
  const prev=ex.scenes[i],c=nextScene(ex,i,'',prev.dur||0);
  const n=rotateRoutes(c,'jog');c.cap=capPrefix||'Rotación: cada grupo pasa a la estación siguiente';
  return n;
}

  $('#rAll').onclick=()=>{closeModal();stopPreview();let ok=true;for(let r=0;r<n-1;r++){if(!rotateOnce(S.ex,S.cur,'Rotación '+(r+1)+' de '+(n-1))){S.ex.scenes.splice(S.cur+1,1);ok=false;break}S.cur++}S.sel=null;renderCard();commit();if(!ok)toast('Ponés los jugadores dentro de las estaciones')}
};

const CATS=['walk','jog','run','sprint'];
function computeStats(ex){
  const P=new Map(),scn=[];let passes=0,passM=0;
  const blank=e=>({e,L:0,T:0,by:{walk:0,jog:0,run:0,sprint:0},drib:0,spr:0,vmax:0});
  ex.scenes.forEach((sc,i)=>{
    let sd=0;
    sc.els.forEach(e=>{
      if(e.t==='player'&&!P.has(e.id))P.set(e.id,blank(e));
      const r=sc.routes[e.id];if(!r||!r.segs.length)return;
      const inf=routeInfo(e,r);
      if(e.t==='player'){
        const rec=P.get(e.id);rec.e=e;
        r.segs.forEach((g,k)=>{if(g.k==='pass')return;const len=inf.lens[k],v=segSpeed(g),c=paceOf(v);rec.by[c]+=len;rec.L+=len;rec.T+=inf.times[k];if(g.k==='drib')rec.drib+=len;if(c==='sprint'&&len>1)rec.spr++;rec.vmax=Math.max(rec.vmax,v)});
        sd+=inf.L;
      }else if(e.t==='ball'){r.segs.forEach((g,k)=>{if(g.k==='pass'){passes++;passM+=inf.lens[k]}})}
    });
    scn.push({i,cap:sc.cap,d:sd,W:timing(sc).W});
  });
  const list=[...P.values()].sort((a,b)=>b.L-a.L),act=list.filter(x=>x.L>0),mult=Math.max(1,+ex.cyc||1)*Math.max(1,+ex.series||1);
  const meas=[];ex.scenes.forEach(sc=>sc.arrows.forEach(a=>{if(a.k==='measure'&&!meas.some(m=>m.id===a.id))meas.push({id:a.id,d:Math.hypot(a.x2-a.x1,a.y2-a.y1),show:a.show!==false})}));
  const sum=act.reduce((q,x)=>q+x.L,0);
  return{list,act,mult,scn,meas,passes,passM,avg:act.length?sum/act.length:0,max:act.length?act[0].L:0,total:totalOf(ex)};
}
function exBrief(ex,series){
  const st=computeStats(ex),m=Math.max(1,+ex.cyc||1)*Math.max(1,+(series==null||series===''?ex.series:series)||1);
  return{avg:st.avg,tot:st.avg*m,n:st.act.length,mult:m};
}
const fmtKm=m=>m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';

}

const AUD={mem:new Map(),dbp:null};
const audIds=ex=>{const a=[];if(ex.aud)a.push(ex.aud.id);ex.scenes.forEach(sc=>{if(sc.aud)a.push(sc.aud.id)});return a};
function audDb(){
  if(AUD.dbp)return AUD.dbp;
  AUD.dbp=new Promise(res=>{try{const r=indexedDB.open('pizarra-fit-audio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('a')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
  return AUD.dbp;
}
async function audPut(id,blob){
  AUD.mem.set(id,{blob,url:URL.createObjectURL(blob)});
  const db=await audDb();if(!db)return false;
  return new Promise(res=>{try{const tx=db.transaction('a','readwrite');tx.objectStore('a').put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false)}catch(e){res(false)}});
}
async function audLoad(ids){
  const need=ids.filter(id=>!AUD.mem.has(id));if(!need.length)return;
  const db=await audDb();if(!db)return;
  await Promise.all(need.map(id=>new Promise(res=>{try{const rq=db.transaction('a').objectStore('a').get(id);rq.onsuccess=()=>{if(rq.result)AUD.mem.set(id,{blob:rq.result,url:URL.createObjectURL(rq.result)});res()};rq.onerror=()=>res()}catch(e){res()}})));
}
async function audGC(){
  const db=await audDb();if(!db)return;
  const keep=new Set();[S.ex].concat(S.lib).forEach(ex=>audIds(ex).forEach(i=>keep.add(i)));
  const keys=await new Promise(res=>{try{const rq=db.transaction('a').objectStore('a').getAllKeys();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res([])}catch(e){res([])}});
  keys.forEach(k=>{if(!keep.has(k)){try{db.transaction('a','readwrite').objectStore('a').delete(k)}catch(e){}}});
}
async function audDuration(blob){
  try{const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();const buf=await ac.decodeAudioData(await blob.arrayBuffer());if(ac.close)ac.close();if(buf.duration>0)return buf.duration}catch(e){}
  return new Promise(res=>{try{const a=new Audio(URL.createObjectURL(blob));a.onloadedmetadata=()=>res(isFinite(a.duration)?a.duration:0);a.onerror=()=>res(0)}catch(e){res(0)}});
}
async function dupAudio(ex){
  const map={};
  for(const id of audIds(ex)){await audLoad([id]);const info=AUD.mem.get(id);if(info){const nid=uid();await audPut(nid,info.blob);map[id]=nid}}
  if(ex.aud&&map[ex.aud.id])ex.aud.id=map[ex.aud.id];
  ex.scenes.forEach(sc=>{if(sc.aud&&map[sc.aud.id])sc.aud.id=map[sc.aud.id]});
}
function audHTML(kind){
  const tgt=kind==='global'?S.ex:scene(),a=tgt&&tgt.aud;
  const mine=!!(S.rec&&S.rec.kind===kind&&(kind==='global'||S.rec.si===S.cur)),other=!!(S.rec&&!mine);
  if(mine)return`<span class="rec"><i class="rdot"></i> Grabando <b class="recT">0:00</b></span><button class="btn danger" data-au="stop" data-k="${kind}">${ic('stop',14)}Detener</button>`;
  const lbl=kind==='global'?'Audio general del video':'Explicación de esta escena';
  if(a)return`<b>${ic('volume',16)} ${lbl} · ${fmtT(a.dur)}</b><button class="btn" data-au="play" data-k="${kind}">${ic('play',14)}Escuchar</button><button class="btn" data-au="rec" data-k="${kind}"${other?' disabled':''}>${ic('mic',14)}Regrabar</button><button class="btn" data-au="up" data-k="${kind}">${ic('upload',14)}Cambiar</button><button class="btn danger" data-au="del" data-k="${kind}" aria-label="Quitar audio">${ic('trash',14)}</button>`;
  return`<b>${lbl}</b><button class="btn pri" data-au="rec" data-k="${kind}"${other?' disabled':''}>${ic('mic',14)}Grabar</button><button class="btn" data-au="up" data-k="${kind}">${ic('upload',14)}Subir audio</button>`;
}
function renderAudRow(){const r=$('#audRow');if(r)r.innerHTML=audHTML('scene')}

function updRec(){const t=S.rec?(performance.now()-S.rec.t0)/1000:0;$$('.recT').forEach(el=>{el.textContent=fmtT(t)})}
function audAction(e){
  const b=e.target.closest('[data-au]');if(!b)return false;const a=b.dataset.au,k=b.dataset.k;
  if(a==='rec')recStart(k);
  else if(a==='stop')recStop();
  else if(a==='up'){S.upKind=k;S.upScene=S.cur;$('#audFile').value='';$('#audFile').click()}
  else if(a==='del'){const tgt=k==='global'?S.ex:scene();delete tgt.aud;commit();refreshAud()}
  else if(a==='play')previewAud(k);

function previewAud(k){

  if(!info){toast('El audio todavía se está cargando');return}

  S.pAud=new Audio(info.url);safePlay(S.pAud);

async function attachAudio(kind,blob,dur,si){
  const id=uid(),saved=await audPut(id,blob);
  const tgt=kind==='global'?S.ex:S.ex.scenes[si==null?S.cur:si];if(!tgt)return;
  tgt.aud={id,dur:Math.round((dur||1)*10)/10};commit();refreshAud();
  toast(saved?'Audio guardado':'Audio cargado, pero este navegador no lo puede guardar: se pierde al cerrar');
}
async function recStart(kind){
  if(S.rec)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Este navegador no permite grabar. Podés subir un audio ya grabado.');return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('No hay permiso para usar el micrófono. Podés subir un audio ya grabado.');return}
  const mimes=['audio/webm;codecs=opus','audio/mp4','audio/webm'],mime=mimes.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:40000}:undefined),chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const rec={kind,si:S.cur,mr,stream,t0:performance.now()};S.rec=rec;
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(rec.tm);S.rec=null;
    const type=(mr.mimeType||mime||'audio/webm').split(';')[0],blob=new Blob(chunks,{type}),timer=(performance.now()-rec.t0)/1000;
    let dur=await audDuration(blob);if(!dur||!isFinite(dur))dur=timer;
    await attachAudio(kind,blob,dur,rec.si);
  };
  mr.start();rec.tm=setInterval(()=>{if((performance.now()-rec.t0)/1000>=180)recStop();updRec()},250);
  refreshAud();
}
function recStop(){if(S.rec&&S.rec.mr.state!=='inactive')S.rec.mr.stop()}
$('#tp').addEventListener('click',e=>{audAction(e)});
$('#audFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  if(f.size>8e6){toast('El audio es muy pesado (máximo 8 MB)');return}
  const dur=await audDuration(f);await attachAudio(S.upKind||'scene',f,dur||10,S.upScene);

const blobToDataURL=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res('');r.readAsDataURL(b)});
function dataURLToBlob(u){const i=u.indexOf(','),mt=(u.slice(5,i).split(';')[0])||'audio/webm',bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mt})}

function physSync(type,p,ch){

    const D=type==='pas'?p.d:p.d*p.legs;
    if(ch==='kmh'&&p.kmh>0)p.t=Math.round(D/(p.kmh/3.6)*10)/10;else if(p.t>0)p.kmh=Math.round(D/p.t*36)/10;

function phDefaults(type){const p={};PH[type].f.forEach(f=>{p[f[0]]=f[2]});physSync(type,p,'t');return p}

function bPas(p,m){

  const sum=()=>{const el=$('#pSum');if(el)el.innerHTML=phTiles(physSummary(st.type,st.p,st.vmax))};
  const body=()=>`<div class="ptabs">${Object.keys(PH).map(k=>`<button class="chip plain${k===st.type?' on':''}" data-pt="${k}">${PH[k].n}</button>`).join('')}</div>

    <div class="mrow"><button class="btn" id="pNo">Cancelar</button><button class="btn pri" id="pGo">Crear ejercicio</button></div>`;
  openModal('Trabajo físico',body(),true);sum();
  const mb=$('#mBody');
  mb.oninput=e=>{
    if(e.target.dataset.pv){st.vmax=+e.target.value||30;store.set('pf.vmax',st.vmax);sum();return}
    const k=e.target.dataset.pk;if(!k)return;st.p[k]=+e.target.value;
    if(['d','legs','t','kmh','L','W','laps','tmin'].includes(k)){
      physSync(st.type,st.p,k);
      $$('[data-pk]',mb).forEach(inp=>{if(inp!==e.target&&['t','kmh','tmin'].includes(inp.dataset.pk))inp.value=st.p[inp.dataset.pk]});
    }
    sum();
  };
  mb.onclick=e=>{
    const tab=e.target.closest('[data-pt]');
    if(tab){st.type=tab.dataset.pt;st.p=phDefaults(st.type);mb.innerHTML=body();sum();return}
    if(e.target.closest('#pNo')){closeModal();return}
    if(e.target.closest('#pGo')){
      const ex=buildPhys(st.type,st.p,st.vmax),go=()=>{closeModal();loadEx(ex);toast('Ejercicio creado: tocá ▶ para verlo y Estadísticas para ver los números')};
      if(S.dirty){closeModal();ask('Tenés cambios sin guardar en este ejercicio. ¿Crear uno nuevo igual?','Crear',go)}else go();
    }
  };
}

$('#bTheme').onclick=()=>{const n=effTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('pf.theme',n);themeIcon()};
addEventListener('keydown',e=>{
  if(S.view!=='board'||!$('#modal').hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==='Delete'||e.key==='Backspace'){const o=selObj();if(o){if(S.sel.k==='el')delEl(o.id);else if(o.k==='measure')S.ex.scenes.forEach(s=>{s.arrows=s.arrows.filter(a=>a.id!==o.id)});else scene().arrows=scene().arrows.filter(a=>a.id!==o.id);S.sel=null;renderCard();commit()}e.preventDefault()}
  else if(mod&&e.key.toLowerCase()==='z'){e.shiftKey?redo():undo();e.preventDefault()}
  else if(mod&&e.key.toLowerCase()==='y'){redo();e.preventDefault()}
  else if(mod&&e.key.toLowerCase()==='d'){dupSel();e.preventDefault()}
  else if(e.key===' '){play();e.preventDefault()}
  else if(e.key==='Escape'){if(S.act!=='move'&&!S.pv){setAct('move');return}setTool('select');S.sel=null;renderCard()}
});

/* ============ inicio ============ */
(function init(){
  const th=store.get('pf.theme',null);if(th)document.documentElement.dataset.theme=th;
  hydrateIcons();themeIcon();
  $('#bUndo').innerHTML=ic('undo');$('#bRedo').innerHTML=ic('redo');$('#loopB').innerHTML=ic('repeat');$('#loopB').classList.add('on');setPlayIcon();
  $('#legend').innerHTML=Object.keys(PACES).map(k=>`<span class="lg"><i style="background:${PACES[k].c}"></i>${PACES[k].n}</span>`).join('')+'<span class="lg"><i style="background:#fff"></i>Pase</span>';
  $('#fieldSel').innerHTML=Object.keys(FIELDS).map(k=>`<option value="${k}">${FIELDS[k].n}</option>`).join('');
  buildPalette();
  S.lib=S.lib.map(norm);
  const draft=store.get('pf.draft',null);
  const first=!draft&&!S.lib.length;
  S.ex=norm((draft&&draft.scenes&&draft.scenes.length)?draft:(first?Object.assign(tRondo(),{id:'demo-rondo',demo:true}):newEx()));
  propagateEx(S.ex,0);
  $('#exName').value=S.ex.name;$('#fieldSel').value=S.ex.field;resetHist();renderScenes();renderCard();
  new ResizeObserver(fit).observe($('#stageWrap'));
  addEventListener('resize',fit);
  fit();
  audLoad(audIds(S.ex)).then(()=>renderScenes());
  const seed=()=>{
    if(S.lib.length)return;
    addExamples();
    if(!S.sess.length||(S.sess.length===1&&!S.sess[0].items.length))addExampleSessions();
    if(S.view==='lib')renderLib();if(S.view==='sess')renderSess();
  };
  const fl=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load("800 20px 'Barlow Condensed'"),document.fonts.load("700 20px 'Barlow Condensed'")]).catch(()=>{}):Promise.resolve();
  fl.then(seed,seed);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildPalette();renderScenes();paint()});
  setTimeout(()=>{audGC()},5000);
  /* app instalable y uso sin conexión (solo cuando se abre desde un sitio web) */
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;$('#bInstall').hidden=false});
  $('#bInstall').onclick=async()=>{if(!S.inst)return;S.inst.prompt();try{await S.inst.userChoice}catch(e){}S.inst=null;$('#bInstall').hidden=true};
  if(first)setTimeout(()=>toast('Ejemplo cargado: tocá ▶ para verlo, o tocá un jugador para ver su menú'),700);
})();
})();
</script>
</body>
</html>
